[package]
name = "opal-signer"
version = "0.1.0"
edition = "2024"

[dependencies]
futures = "0.3.34"
hex = "0.4.3"
nostr-sdk = "0.45"
opal-core = { version = "0.1.0", path = "../opal-core" }
rand = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["full"] }
tracing = "0.1.44"
url = "2.5.8"

[dev-dependencies]
nostr-connect = "0.45"
nostr-sdk = { version = "0.45", features = ["local-relay"] }
tracing-subscriber = "0.3.23"
