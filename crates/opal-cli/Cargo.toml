[package]
name = "opal-cli"
version.workspace = true
edition = "2024"

[[bin]]
name = "opal"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
opal-core = { path = "../opal-core" }
qrcode = "0.14.1"
rpassword = "7.5.4"
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
