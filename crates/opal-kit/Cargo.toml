[package]
name = "opal-kit"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Shared runtime pieces for Opal and Peridot: signing, relays, the control socket"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
futures = "0.3.34"
nostr-connect = "0.45"
nostr-sdk = "0.45"
opal-core = { path = "../opal-core" }
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "json"] }
rusqlite = "0.40.2"
rustix = { version = "1.1.5", features = ["process"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
tracing = "0.1.44"
zeroize = "1.9.0"

[dev-dependencies]
nostr-sdk = { version = "0.45", features = ["local-relay"] }
