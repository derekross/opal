# Build opald and opal for a version tag and publish them as a GitHub
# Release, with SHA256SUMS and build-provenance attestations.
#
#   git tag v0.2.0 && git push origin v0.2.0
#
# The tag must match the version in manifest.json and Cargo.toml.
# Builds run on Ubuntu 22.04 (glibc 2.35) so the binaries also run on
# older systems than Arch. No build cache: release binaries are built from
# a clean checkout every time.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
          - arch: aarch64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check versions match the tag
        run: |
          tag="${GITHUB_REF_NAME#v}"
          manifest="$(jq -r .version manifest.json)"
          cargo_version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)"
          echo "tag=$tag manifest=$manifest cargo=$cargo_version"
          [[ $tag == "$manifest" && $tag == "$cargo_version" ]]

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: stable

      - name: Test
        run: cargo test --locked --workspace

      - name: Build
        run: cargo build --locked --release -p opald -p opal-cli

      - name: Package
        id: package
        run: |
          name="opal-${GITHUB_REF_NAME}-${{ matrix.arch }}-linux"
          mkdir -p "dist-out/$name"
          install -m755 target/release/opald target/release/opal "dist-out/$name/"
          cp LICENSE README.md "dist-out/$name/"
          tar -C dist-out -czf "dist-out/$name.tar.gz" --owner=0 --group=0 "$name"
          echo "file=dist-out/$name.tar.gz" >>"$GITHUB_OUTPUT"

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.package.outputs.file }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.arch }}
          path: ${{ steps.package.outputs.file }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: out
          merge-multiple: true

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd out
          sha256sum opal-*.tar.gz >SHA256SUMS
          cat SHA256SUMS
          gh release create "$GITHUB_REF_NAME" opal-*.tar.gz SHA256SUMS \
            --title "Opal $GITHUB_REF_NAME" --generate-notes --verify-tag
